<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HydroTrack - Water Reminder</title>

https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#e6f7ff,#cceeff);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.phone{
width:380px;
max-width:100%;
background:white;
border-radius:30px;
padding:20px;
box-shadow:0 20px 40px rgba(0,0,0,0.15);
}

.header{
display:flex;
justify-content:center;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:32px;
font-weight:700;
color:#1f5d9b;
}

.logo span{
color:#56c4ff;
}

.card{
background:white;
border-radius:25px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
text-align:center;
}

.stats{
margin-bottom:15px;
}

.stats h4{
font-weight:500;
color:#666;
}

.stats h2{
margin-top:8px;
}

.circle-wrap{
display:flex;
justify-content:center;
position:relative;
margin:15px 0;
}

svg{
transform:rotate(-90deg);
}

.progress-bg{
fill:none;
stroke:#e3e3e3;
stroke-width:14;
}

.progress{
fill:none;
stroke:#53c6ff;
stroke-width:14;
stroke-linecap:round;
transition:.5s;
}

.center-text{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:28px;
font-weight:bold;
color:#1f5d9b;
}

.controls{
display:flex;
justify-content:space-around;
margin-top:15px;
}

.btn-group{
text-align:center;
}

.circle-btn{
width:60px;
height:60px;
border:none;
border-radius:50%;
font-size:30px;
cursor:pointer;
background:#50c5ff;
color:white;
box-shadow:0 8px 17px rgba(0,0,0,0.15);
}

.minus{
background:#ddd;
color:#333;
margin-top:10px;
}

.ml{
margin-top:8px;
font-weight:600;
}

.goal-box{
margin-top:20px;
}

.goal-box input{
padding:10px;
width:120px;
border-radius:10px;
border:1px solid #ccc;
text-align:center;
}

.goal-box button{
padding:10px 12px;
border:none;
background:#4abfff;
color:white;
border-radius:10px;
cursor:pointer;
}

.history{
margin-top:30px;
}

.history h3{
text-align:center;
margin-bottom:10px;
}

.bars{
height:140px;
display:flex;
justify-content:space-between;
align-items:flex-end;
margin-top:15px;
}

.bar{
width:30px;
border-radius:10px 10px 0 0;
background:linear-gradient(#99ddff,#43c4ff);
display:flex;
align-items:flex-end;
justify-content:center;
color:#fff;
font-size:11px;
}

.day{
text-align:center;
font-size:12px;
margin-top:5px;
}

.reminder{
margin-top:25px;
background:#eefaff;
padding:15px;
border-radius:15px;
text-align:center;
}

.reminder button{
margin-top:10px;
padding:10px 15px;
border:none;
background:#2196f3;
color:white;
border-radius:10px;
cursor:pointer;
}

.footer{
margin-top:20px;
display:flex;
justify-content:space-around;
padding-top:15px;
border-top:1px solid #eee;
color:#777;
font-size:14px;
}

.water-drop{
font-size:50px;
}
</style>
</head>

<body>

<div class="phone">

<div class="header">
<div class="logo">Hydro<span>Track</span></div>
</div>

<div class="card">

<div class="stats">
<h4>TODAY'S INTAKE</h4>
<h2><span id="currentLitres">0</span>L /
<span id="goalLitres">3</span>L GOAL</h2>
</div>

<div class="circle-wrap">

<svg width="220" height="220">
<circle class="progress-bg" cx="110" cy="110" r="90"></circle>

<circle
class="progress"
cx="110"
cy="110"
r="90"
stroke-dasharray="565"
stroke-dashoffset="565"
id="progressCircle">
</circle>
</svg>

<div class="center-text">
💧<br>
<span id="percent">0%</span>
</div>
</div>

<div class="controls">

<div class="btn-group">
<button class="circle-btn" onclick="addWater(250)">+</button>
<div class="ml">250ml</div>

<button class="circle-btn minus"
onclick="removeWater(250)">−</button>
</div>

<div class="btn-group">
<button class="circle-btn" onclick="addWater(500)">+</button>
<div class="ml">500ml</div>

<button class="circle-btn minus"
onclick="removeWater(500)">−</button>
</div>

</div>

<div class="goal-box">
<input type="number" id="goalInput" value="3000">
<button onclick="setGoal()">Set Goal (ml)</button>
</div>

</div>

<div class="history">
<h3>Last 7 Days</h3>

<div class="bars" id="historyBars"></div>
</div>

<div class="reminder">
<h3>Stay Hydrated 💦</h3>
<p>Enable notifications every hour.</p>
<button onclick="enableReminder()">
Enable Reminder
</button>
</div>

<div class="footer">
<div>⚙ Settings</div>
<div>📅 History</div>
<div>ℹ Info</div>
</div>

</div>

<script>

let intake =
parseInt(localStorage.getItem("intake")) || 0;

let goal =
parseInt(localStorage.getItem("goal")) || 3000;

document.getElementById("goalInput").value = goal;

function updateUI() {

let percent = Math.min(
(Math.round((intake/goal)*100)),100);

let circumference = 565;

let offset =
circumference -
(percent/100)*circumference;

document.getElementById("progressCircle")
.style.strokeDashoffset = offset;

document.getElementById("percent")
.innerText = percent + "%";

document.getElementById("currentLitres")
.innerText = (intake/1000).toFixed(1);

document.getElementById("goalLitres")
.innerText = (goal/1000).toFixed(1);

localStorage.setItem("intake", intake);
localStorage.setItem("goal", goal);
}

function addWater(amount){
intake += amount;
saveHistory(amount);
updateUI();
}

function removeWater(amount){
intake = Math.max(0,intake-amount);
updateUI();
}

function setGoal(){
goal =
parseInt(document.getElementById("goalInput").value);
updateUI();
}

function saveHistory(amount){

let history =
JSON.parse(localStorage.getItem("waterHistory")) || [];

let today = new Date().toLocaleDateString();

let existing =
history.find(item=>item.date===today);

if(existing){
existing.amount += amount;
}else{
history.push({
date:today,
amount:amount
});
}

localStorage.setItem(
"waterHistory",
JSON.stringify(history)
);

renderHistory();
}

function renderHistory(){

let container =
document.getElementById("historyBars");

container.innerHTML="";

let history =
JSON.parse(localStorage.getItem("waterHistory")) || [];

let last7 = history.slice(-7);

last7.forEach(item=>{

let h =
Math.max(25,
(item.amount/3000)*130);

let box =
document.createElement("div");

box.innerHTML=
`
<div class="bar"
style="height:${h}px;">
</div>
<div class="day">
${item.date.split('/')[0]}
</div>
`;

container.appendChild(box);
});
}

async function enableReminder() {

if(Notification.permission !== "granted"){
await Notification.requestPermission();
}

setInterval(()=>{

if(Notification.permission==="granted"){

new Notification(
"💧 Time to Drink Water!",
{
body:"Stay hydrated and healthy."
}
);

}
},3600000);

alert("Hourly Reminder Activated");
}

updateUI();
renderHistory();

</script>

</body>
</html>
